services:
  mysql:
    image: mysql:8.0
    container_name: dementia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dementia_db
      MYSQL_USER: healthcareuser
      MYSQL_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  backend:
    build: ./backend
    container_name: dementia-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s 

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    container_name: dementia-nginx
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "9000:80"

volumes:
  mysql_data: