services:
  mysql:
    image: mysql:8.0
    container_name: dementia-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: dementia_db
      MYSQL_USER: healthcareuser
      MYSQL_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  frontend:
    build: ./frontend
    container_name: dementia-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend    
    container_name: dementia-backend
    restart: always
    depends_on:
        mysql:
          condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env 

volumes:
  mysql_data: